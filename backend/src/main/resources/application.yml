micronaut:
  application:
    name: mogaoDigitalTwin
  io:
    watch:
      enabled: false
  server:
    port: 8008
    max-request-size: 500MB
    multipart:
      enabled: true
      max-file-size: 500MB
    cors:
      enabled: true
      configurations:
        web:
          allowedOrigins:
            - http://localhost:8009
            - http://localhost:8008
            - http://127.0.0.1:8009
            - http://127.0.0.1:8008
          allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowedHeaders:
            - Content-Type
            - Authorization
  router:
    static-resources:
      exhibit-models:
        enabled: true
        mapping: /exhibit_models/**
        paths:
          - classpath:exhibit_models
          - file:exhibit_models

jackson:
  serialization:
    indentOutput: true
